spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tallerfacil_test}
    username: ${DB_USER:tallerfacil}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-on-validation-error: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-key-256-bits-for-testing-purposes-only}
    expiration-hours: 1
  cors:
    allowed-origins: http://localhost:3000
